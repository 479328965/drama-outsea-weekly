name: daily-collect

on:
  schedule:
    - cron: '30 1 * * *'   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect rankings and build daily report
        run: python scripts/daily.py

      - name: Build weekly report
        run: python scripts/weekly.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date -u +%F) auto collect" || echo "no changes"
          git push
